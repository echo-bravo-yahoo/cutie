connections: []

tasks:
  # most sensors offer a 'combined config' syntax that
  # does sampling accumulate for you
  thermometer-combined-config:
    trigger:
      # "trigger:random" is a sensor that returns a number
      # that changes slightly between each trigger
      type: "trigger:random"

      # sampling interval is how long between each sensor
      # sample (reading)
      samplingInterval: 1000
      # reporting interval is how long the sensor waits
      # before reporting its readings to the first step
      # in the task. in this case, since samplingInterval
      # is 5x smaller than reportingInterval, the array
      # sent to the steps will have 5 items in it
      reportingInterval: 5000

      # these settings configure the random number
      # generated by "trigger:random"
      start: 24
      min: 18
      max: 32
      minStep: .035
      maxStep: .5

    steps:
      - type: "output:console"

  # sensors can also offer a 'split config' syntax that
  # gives you control over sampling and accumulation
  thermometer-split-config:
    trigger:
      # start with an interval trigger; this is analagous
      # to the samplingInterval in the combined config
      type: "trigger:interval"
      interval: 1000

    steps:
      # use the sensor as a read step
      - type: "read:random"
        start: 72
        min: 60
        max: 80
        minStep: 1
        maxStep: 1
      # this step accumulates 5 sensor readings before
      # it forwards the message on to the next step; this
      # is analogous to reportingInterval but controlled
      # by message count, not by time
      - type: "transform:accumulate"
        count: 5
      - type: "output:console"
