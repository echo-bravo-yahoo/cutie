connections: []

tasks:
  reshape-a-reading:
    # tasks can carry arbitrary values under "data". every step can reach
    # them by interpolation, which is how we tag the reading below.
    data:
      node: "bedroom"

    trigger:
      # trigger:once fires a single message and stops, which makes it a good
      # way to demonstrate a transform chain. strings anywhere inside the
      # message get interpolated, including nested ones.
      type: "trigger:once"
      message:
        sensorId: "bme280-1"
        readings:
          degreesC: 21.4712
          relativeHumidity: 48.9
        debug:
          rawRegister: "0x7f"

    steps:
      # transform:merge folds additional objects into the message. sources can
      # be literal objects, or "$$"-prefixed paths looked up from the
      # interpolation context - here, the task's own data block.
      - type: "transform:merge"
        sources:
          - "$$task.config.data"
          - collectedBy: "cutie"

      # transform:munge moves, copies, and drops keys. each path names an
      # operation:
      #   rename    - move the value to "to", removing the original
      #   duplicate - copy the value to "to", keeping the original
      #   remove    - drop the value
      #   retain    - keep the value as-is
      # the "*" path applies to every key not named above it. with "retain",
      # as below, everything unmentioned is kept and this config is a
      # blocklist. change it to "remove" to invert that, and only the keys
      # named above survive.
      - type: "transform:munge"
        paths:
          readings.degreesC:
            op: "rename"
            to: "temperature"
          readings.relativeHumidity:
            op: "rename"
            to: "humidity"
          sensorId:
            op: "duplicate"
            to: "meta.sensor"
          # renaming the two values out of "readings" empties it but leaves
          # the key behind, so drop the husk explicitly
          readings:
            op: "remove"
          debug:
            op: "remove"
          "*":
            op: "retain"

      # now that the numbers live at the top level, round them
      - type: "transform:round"
        paths:
          temperature:
            precision: 2
          humidity:
            precision: 1

      # transform:prettify turns the object back into indented JSON text
      - type: "transform:prettify"
        spaces: 2

      - type: "output:console"
